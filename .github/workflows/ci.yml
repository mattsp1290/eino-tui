name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Go ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.26.8
          cache: true
      - name: Formatting
        run: make fmt-check
      - name: Module graph and exact pins
        run: make check-mod
      - name: Vet
        run: make vet
      - name: Unit tests
        run: make test
      - name: SQLite integration tests
        run: make test-integration
      - name: Race tests
        run: make test-race
      - name: PTY tests
        run: make test-pty
      - name: Production build
        run: make build
